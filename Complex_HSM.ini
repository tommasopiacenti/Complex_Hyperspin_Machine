#SYSTEM SIZE
N = 50

#HYPERSPIN DIMENSION
D = 2

#INITIAL CONDITIONS TYPE (0 = REAL, 1 = PURE IMAGINARY, 2 = GENERAL COMPLEX)
initial_type = 2

#MAX INITIAL FIELD AMPLITUDE
Amax = 0.1

#PUMP AVERAGE PHASE & MAX DEVIATION
phim = 0
dphi = 0

#PUMP AMPLITUDE & MAX DEVIATION & Pump Dynamic Change
hm = 0
dh = 0
Dh = 0
Dh2 = 0

#RAMP PARAMETERS (t_hramp = start time, n_hramp = number of steps,
#Dt_hramp = time between steps, Dhramp = h increment per step)
t_hramp = -1
n_hramp = 0
Dt_hramp = 0
Dhramp = 0

#INTRINSIC LOSS AND NONLINEAR COUPLING
gm = 0
beta = 0.1

#EQUALIZATION COUPLING
deq = 1

#ENERGY TO REACH AND STOP
stop_at_E_target = 0
E_target = -1
E_target_tol = 0.0000000001

#STOP WHEN STABLE (|H - H_prev| < allowed_H_change for stable_window consecutive checks)
stop_when_stable = 1
allowed_H_change = 1e-15
steps_for_update = 10
stable_window = 1000

#RELATIVE vs ABSOLUTE (0 = absolute check |H-H_prev| < allowed_H_change || 1 = relative check |H-H_prev|/|H| < allowed_H_change)
relative_H_change = 0

#SIMULATION TIME AND STEP
tmax = 1000000
dt = 0.01

#DYNAMIC START TIMES FOR COUPLING AND EQUALIZARTION
t_coup = 0
t_eq = 0
t_pump = -1
t_pump2 = -1

#SAVE DYNAMICS? (0 = ONLY FINAL STATE || 1 = ALL || 2 = H, Ly, FINAL STATE || 3 = Single H,Ly,m,<DS2> file & FINAL STATE)
save_dyn = 3

#GENERATE NEW COUPLINGS? (0 = NO->READ OLD, 1 = YES->OVERWRITE OLD, 2 = LATTICE)
new_coupling = 1

#PROBABILITY OF POSITIVE RE/IM COUPLING SIGNS (INDEPENDENT) AND COUPLING ROTATION PHASE (RADIANS)
prob_coup = 1
prob_pm_re = 0.5
prob_pm_im = 0.5
coup_phase = 0
type_coup = 2

#BUFFERED I/O SETTINGS
save_steps = 1000
buffer_size = 262144
flush_interval = 1000

#OUTPUT DIRECTORY (0 = files in current dir, 1 = results/run_<hash>/ folder)
output_dir = 0

#COMPUTE EIGENVALUES (0 = sparse-only, no dense J; 1 = dense J + eigenvalues)
compute_eigenvalues = 0

#LATTICE PARAMETERS (used only when new_coupling = 1)
lattice_d = 2
lattice_NL = 1000
lattice_bc = 1

#PARALLELIZATION (num_threads = 1 means sequential)
num_threads = 4
